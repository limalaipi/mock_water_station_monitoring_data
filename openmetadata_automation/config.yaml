# prom Automation Config
# ================================
# แก้ไขค่าเหล่านี้ก่อนรัน script
# Secrets อยู่ใน .env — ไม่ commit ไฟล์นี้ลง git

prom:
  url: http://10.10.10.181:30080
  username: ${PROM_USER}
  password: ${PROM_PASS}
  domain: "DE-DataQuality"

run_ingestion_after_add: true

semantic: &default_semantic
  - type: "ตรวจสอบความเป็นปัจจุบัน"
    column: "insert_date"
  - type: "timeliness decay"
    column: "insert_date"
  - type: "de-dataquality-water-org-unit"
    column: "department_id"
  - type: "แปลงเลขบัตรประชาชน"
    column: "monitor_id_card"
  - type: "province_code"
    column: "province_code"
  - type: "url"
    column: "station_url"
  - type: "de-dataquality-water-good-oxygen"
    column: "water_do"

default_ingestion: &default_ingestion
  tier: "Tier1"
  include_stored_procedures: false
  database_includes:
    - "demo_dg_db"
  schema_includes:
    - "demo_dg_db"
  table_includes:
    - "water_station"
    - "water_station_monitor"
  semantic: *default_semantic

default_filters: &default_filters
  database_includes:
    - "demo_dg_db"
  schema_includes:
    - "demo_dg_db"
  table_includes:
    - "water_station"
    - "water_station_monitor"


databases:

  # postgresql:
  #   enabled: true
  #   service_name: de-dataquality-Postgres
  #   description: "PostgreSQL data quality testing database"
  #   host_port: "10.10.10.176:5432"
  #   username: ${POSTGRES_USER}
  #   password: ${POSTGRES_PASS}
  #   database: ${POSTGRES_DB}
