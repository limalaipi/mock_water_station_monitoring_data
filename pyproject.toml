[project]
name = "water-station-monitoring"
version = "0.1.0"
description = "Multi-database water station data quality testing framework"
requires-python = ">=3.8"

dependencies = [
    # Core
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "faker>=19.0",
    # Data formats
    "pyarrow>=12.0",
    "requests>=2.31",
    # Database drivers
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "impyla>=0.19",
    "thrift>=0.16",
    "pure-sasl>=0.6.2",
    "pyhive>=0.7",
    "mysql-connector-python>=8.0",
    "oracledb>=1.4",
    "pyodbc>=5.0",
    "jaydebeapi>=1.2",
    "jpype1>=1.4",
    "jaydebeapi>=1.2.3",
    "playwright>=1.48.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-html>=4.0",
    "pytest-cov>=4.0",
]

[tool.uv]
default-groups = ["dev"]
